# Weekly screenshot refresh. Regenerates every screenshot and opens a PR only when one of
# them meaningfully changed, judged by a pixel diff with a tolerance rather than by bytes.
#
# All logic lives in scripts/refresh-screenshots.sh, which runs the same way locally:
#
#   scripts/refresh-screenshots.sh                   # regenerate and compare
#   scripts/refresh-screenshots.sh --compare-only    # compare what is already on disk
#   scripts/refresh-screenshots.sh --threshold 0.005 # stricter tolerance
#
# It exits 0 when nothing meaningful changed and 2 when there is something to review, and
# leaves diff images in .screenshot-diffs.

name: Update screenshots

on:
  schedule:
    - cron: '0 8 * * 1'  # every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: differing-pixel ratio that counts as a real change
        required: false
        default: '0.02'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            screenshots/package-lock.json

      - name: Install site modules
        run: npm ci

      - name: Install screenshots CLI
        run: npm ci
        working-directory: ./screenshots

      - name: Install Playwright webkit
        run: npx playwright install webkit --with-deps
        working-directory: ./screenshots

      - name: Regenerate and compare
        id: refresh
        run: |
          set +e
          scripts/refresh-screenshots.sh --threshold "${{ inputs.threshold || '0.02' }}"
          status=$?
          set -e
          if [ "$status" -eq 1 ] || [ "$status" -gt 2 ]; then exit 1; fi
          echo "changed=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload diff images
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: .screenshot-diffs/
          if-no-files-found: ignore

      - name: Open PR with updated screenshots
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="screenshots/auto-update-$(date +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/img/screenshots/
          git commit -m "chore: update screenshots $(date +%Y-%m-%d)"
          git push origin "$BRANCH"

          FILES=$(git diff --name-only HEAD~1 HEAD | sed 's|.*/||' | sed 's/^/- /')
          gh pr create \
            --title "chore: update screenshots $(date +%Y-%m-%d)" \
            --body "Weekly screenshot refresh. Only images whose pixel diff exceeded the tolerance are included; anything within tolerance was reverted to the committed version.

          ### Changed

          ${FILES}

          Diff images are attached to this workflow run as the \`screenshot-diffs\` artifact." \
            --label "screenshots" \
            --base main

      - name: No changes
        if: steps.refresh.outputs.changed == 'false'
        run: echo "All screenshots within tolerance -- no PR needed."
