# Validates Bluehawk annotations in extractedcode on every pull request.
# Catches annotation errors before merge so broken snippets never reach main.
#
# REPLACE: adjust the paths trigger if your extractedcode directory has a different path.
# REPLACE: adjust working-directory if your Astro project is not in astro/.

name: Validate code snippet annotations

on:
  pull_request:
    paths:
      - 'astro/extractedcode/**'

jobs:
  check:
    name: Validate code snippet annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro

      - name: Validate Bluehawk annotations
        run: npm run validate-code-snippets
        working-directory: astro
