# Tests extractedcode project directories on pull requests.
# Discovers which directories changed, then runs each one's tests/test.sh in parallel.
#
# REPLACE: adjust the paths trigger if your extractedcode directory has a different path.
# REPLACE: adjust working-directory / path references if your Astro project is not in astro/.
# REPLACE: add or remove the Cargo cache step depending on whether any projects use Rust.
# REPLACE: add language-specific caches (Maven, Go module cache, etc.) as needed.
#
# Each extractedcode subdirectory must contain a tests/test.sh that exits non-zero on failure.

name: Test extractedcode

on:
  pull_request:
    paths:
      - 'astro/extractedcode/**'
  workflow_dispatch:

jobs:
  discover:
    name: Discover changed test suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scan
        name: Scan for changed extractedcode directories
        run: |
          set -euo pipefail

          # Require every extractedcode dir to have a tests/test.sh
          for dir in astro/extractedcode/*/; do
            name=$(basename "$dir")
            if [ ! -f "${dir}tests/test.sh" ]; then
              echo "ERROR: extractedcode directory missing tests/test.sh: $name" >&2
              exit 1
            fi
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dirs=()
            for dir in astro/extractedcode/*/; do
              dirs+=("$(basename "$dir")")
            done
          else
            git fetch origin "${{ github.base_ref }}" --depth=1
            dirs=()
            for dir in astro/extractedcode/*/; do
              name=$(basename "$dir")
              if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "astro/extractedcode/$name/"; then
                dirs+=("$name")
              fi
            done
          fi

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No extractedcode directories changed"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -sc .)
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "Suites to test: ${dirs[*]}"
          fi

  test:
    name: Test ${{ matrix.extractedcode }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extractedcode: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # Remove this step if none of your extractedcode projects use Rust/Cargo.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.extractedcode }}-${{ hashFiles(format('astro/extractedcode/{0}/**/Cargo.toml', matrix.extractedcode)) }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: bash tests/test.sh
        working-directory: astro/extractedcode/${{ matrix.extractedcode }}
