services:
  bss-docs:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../dist:/app/dist:ro
    # Serve dist at the root. It used to be symlinked under /docs, from when the site
    # was built with base: '/docs'; with base: '/' the asset hrefs are root-relative,
    # so under a prefix every page 404s or renders unstyled.
    command: sh -c "test -f /app/dist/index.html || { echo 'dist/ not built -- run npm run screenshots from the project root'; exit 1; }; npx --yes serve /app/dist -l 4000 --no-clipboard"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 3s
      timeout: 5s
      retries: 30
